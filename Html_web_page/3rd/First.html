<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html with Bigan</title>
</head>
<body>
    <h1>University Registration Form</h1>
    <p>Please fill out the form below to register.</p>
    <hr>
    <h2>Personal Details</h2>
    <form action="submit.html" method="post">
        <label>First Name:</label>
        <input type="text" name="first_name" placeholder="e.g.,Arjun" required>
        <br><br>

        <label>Last Name:</label>
        <input type="text" name="last_name" placeholder="   e.g.,Kumar" required>
        <br><br>
        <label>Date of Birth:</label>
        <input type="date" name"dob" placeholder="dd//mm//yyyy" required>
        <br><br>
        <label>Gender</label>
        <br>
        <input type="radio" name="gender" value="male">Male
        <br>
        <input type="radio" name="gender" value="female">Female
        <br>
        <input type="radio" name="gender" value="other">Other
        <br><br>
        <label>Upload Your Photo:</label>
        <br>
        <input type="file" name="photo" accept="image/*" required>
        <br><br>
        <hr>


        <h1>Contact Information</h1>
        <label>Email Address:</label>
        <input type="text" name="email" placeholder="you@example.com">
        <br><br>
        <label>Phone Number:</label>
        <input type="number" name="number" placeholder="e.g., 9807564234">
        <br><br>
        <label>Mailing Address:</label>
        <br>
        <textarea name="address" rows="4" cols="20" placeholder="Street Address, City, State, Zip Code" required></textarea>
        <br><br>
        
        <hr>
        <h1>Academic Information</h1>
        <label>Select Your Cource:</label>
        <select name="course" required>
            <option value="">-- Choose a Course --</option>
        </select>
        <br><br>
        <label>Extracurricular Interests:</label>
        <br>
        <input type="checkbox">Sports
        <br>
        <input type="checkbox">Music & Arts
        <br>
        <input type="checkbox">Technology Clubs
        <br>
        <input type="checkbox">Volunteering
        <hr>

        <h1>Create your own account</h1>
        <br>
        <label>Create a password:</label>
        <input type="password" name="password" required>
        <br><br>
        <label>Security Question:</label>
        <select name="Security" required>
            <option value="">what was your first pet's name?</option>
        </select>
        <br><br>
        <label>Security Answer:</label>
        <input type="text"><br><br>

        <input type="checkbox" name="terms" required>
        <label>I agree to the Terms & Conditions.</label>
        <br><br>
        <hr>
        
        <input type="submit" value="Register">
        <input type="reset" value="Clear Form">
    </form>

</body>
</html>
